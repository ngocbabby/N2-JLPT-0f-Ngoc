<!doctype html>
<html lang="vi" data-theme="system">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>N2 日本語資料室</title>
<style>
:root{font-family:"Noto Sans JP","Yu Gothic",sans-serif;--bg:#efede7;--paper:#fffdf8;--text:#24231f;--muted:#6d6961;--line:#d9d4ca;--accent:#6f5f4f}html[data-theme=dark]{--bg:#20201e;--paper:#292824;--text:#f1eee6;--muted:#b7b2a8;--line:#44413b;--accent:#c7b29a}@media(prefers-color-scheme:dark){html[data-theme=system]{--bg:#20201e;--paper:#292824;--text:#f1eee6;--muted:#b7b2a8;--line:#44413b;--accent:#c7b29a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.75}button,select{font:inherit;color:inherit}.site-header{border-bottom:1px solid var(--line);background:var(--bg)}.header-inner{max-width:1000px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between}.home,.library,.lesson-shell{width:min(860px,calc(100% - 36px));margin:auto;padding:48px 0}.home{width:min(730px,calc(100% - 36px))}h1,h2,.jp,.word,.glyph{font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.rows{border-top:1px solid var(--line)}.category-row,.book-row,.toc-list button{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:16px;display:grid;grid-template-columns:90px 1fr auto;gap:12px}.paper,.toc-paper,.empty{background:var(--paper);border:1px solid var(--line);padding:clamp(28px,6vw,60px)}.breadcrumbs{font-size:.8rem;color:var(--muted);margin-bottom:24px}.toolbar{display:flex;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--line)}.quiet,.audio,.reading-mode button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 9px}.jp-line,.vocab,.kanji,.dialogue{padding:16px 0;border-bottom:1px solid var(--line)}.jp-row{display:flex;gap:10px}.jp{font-size:1.28rem;line-height:2.15;margin:0;flex:1}.vi,.note{color:var(--muted);font-size:.9rem}.audio{width:34px;height:34px;padding:0}rt{font-size:.52em;color:var(--muted)}.glyph{font-size:6rem}.demo{color:var(--accent)}.source,.printable,.ai-layer,.question,.script{margin:30px 0}.formula,.answer{background:#8881;padding:14px}.drawer{position:fixed;z-index:20;inset:0 auto 0 0;width:min(360px,88vw);background:var(--paper);transform:translateX(-105%);overflow:auto}.drawer.open{transform:none}.backdrop{position:fixed;z-index:19;inset:0;background:#0005;border:0}.lesson-nav{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px;margin-top:40px}table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px}figure img{max-width:100%}@media(max-width:700px){.lesson-shell{width:100%;padding-top:12px}.paper{border-left:0;border-right:0}.toolbar{font-size:.8rem}.jp{font-size:1.2rem}.glyph{font-size:5rem}}@page{size:A4 portrait;margin:18mm 16mm}@media print{html,body{background:#fff;color:#111}.no-print,.site-header,.toolbar,.drawer,.backdrop,.audio,.lesson-nav,.breadcrumbs,.reading-mode{display:none!important}.lesson-shell,.paper{width:auto!important;margin:0!important;padding:0!important;border:0!important}.jp-line,.vocab,.kanji,.dialogue,.question,figure,table{break-inside:avoid}h1,h2,h3,summary{break-after:avoid}details:not([open])>:not(summary){display:block!important}rt{color:#333}.jp{font-size:12pt}}
</style>
</head>
<body><div id="app"></div><script type="module" src="./app.js"></script></body>
</html>
